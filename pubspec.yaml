name: agriguard_fyp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
  image: ^4.1.4
  collection: ^1.18.0
  path_provider: ^2.1.1
  permission_handler: ^12.0.0+1
  flutter_image_filters: ^0.0.28
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  http: ^1.2.2
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  intl: any
  tflite_flutter: ^0.12.1
  pdf:
  geolocator: ^14.0.2
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  share_plus: ^7.2.2




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/models/plant_species_final_quantized.tflite
    - assets/models/labels.txt
    - assets/images/
    - assets/models/plant_disease_dynamic_quant.tflite 
    - assets/models/disease_labels.txt
    - assets/models/severity_dynamic_quant.tflite
    - assets/models/severity_labels.txt
    - assets/models/model_info.json
    - assets/data/remediation.json
    - assets/data/disease_causes.json
    - assets/data/mapping.json

# Launcher Icon Configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff" # dark background
  adaptive_icon_foreground: "assets/logo.png"
