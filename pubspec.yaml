name: agriguard_fyp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase packages (all compatible versions)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.1.0  # UPDATED VERSION

  # Notifications
  flutter_local_notifications: ^18.0.1  # UPDATED VERSION

  # Image & Media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.1.4
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  lottie: ^3.3.1

  # Storage & Files
  path_provider: ^2.1.1
  share_plus: ^7.2.2
  pdf: ^3.11.1

  # Permissions & Location
  permission_handler: ^12.0.0+1
  geolocator: ^14.0.2

  # State Management & Utils
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  collection: ^1.18.0
  uuid: ^4.5.0
  intl: ^0.20.2

  # Networking
  http: ^1.2.2
  url_launcher: ^6.3.2

  # Social login
  google_sign_in: ^6.2.1

  # ML & AI
  tflite_flutter: ^0.12.1

  # Other
  package_info_plus: ^8.3.0
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  printing: ^5.13.1   # provides PdfGoogleFonts
  file_picker: ^8.1.2
  csv: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/diag.png
    - assets/farm.png
    - assets/adv.png
    - assets/analytics.png
    - assets/icon.png
    - assets/library.png
    - assets/images/
    - assets/images/help/
    - assets/models/severity_dynamic_quant.tflite
    - assets/models/severity_labels.txt
    - assets/new_model/plantcity_52classes.tflite
    - assets/new_model/plantcity_classes.txt
    - assets/new_model/plantcity_classes.json
    - assets/data/remediation.json
    - assets/data/disease_causes.json
    - assets/data/mapping.json
    - assets/translations/
    - assets/data/


# Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2D6A4F"
  adaptive_icon_foreground: "assets/icon.png"

