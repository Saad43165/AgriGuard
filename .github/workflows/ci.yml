name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    # Linux is case-sensitive, so this catches import/folder casing mistakes
    # that stay hidden on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the build; warnings are reported)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd functions && npm test
